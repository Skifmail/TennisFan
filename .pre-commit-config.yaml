repos:
  - repo: https://github.com/psf/black
    rev: 24.1.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^docs_venv/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [--explicit-package-bases, apps, config]
        exclude: ^(docs_venv/|venv/|\.venv/)
        pass_filenames: false  # проверяем только apps и config, без путей из venv
        additional_dependencies: [types-requests, types-python-dateutil, types-Pillow]
