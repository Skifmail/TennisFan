# Docker Compose для деплоя через Dokploy.
# Содержит PostgreSQL; переменные окружения задаются в Dokploy UI (вкладка Environment).
# В General укажите: Compose file path = docker-compose.dokploy.yml
# (version убран — атрибут устарел в новых Docker Compose)

x-app-env: &app-env
  DEBUG: "False"
  USE_POSTGRES: "True"
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  SECRET_KEY: ${SECRET_KEY}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
  TELEGRAM_SUPPORT_BOT_TOKEN: ${TELEGRAM_SUPPORT_BOT_TOKEN}
  TELEGRAM_USER_BOT_TOKEN: ${TELEGRAM_USER_BOT_TOKEN}
  TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID}
  TELEGRAM_BOT_SITE_BASE_URL: ${TELEGRAM_BOT_SITE_BASE_URL}
  TELEGRAM_PRIVATE_COMMUNITY_CHAT_ID: ${TELEGRAM_PRIVATE_COMMUNITY_CHAT_ID}
  TELEGRAM_PUBLIC_COMMUNITY_URL: ${TELEGRAM_PUBLIC_COMMUNITY_URL:-https://t.me/TennisFanu}
  YANDEX_MAPS_API_KEY: ${YANDEX_MAPS_API_KEY}
  YANDEX_GEOCODER_API_KEY: ${YANDEX_GEOCODER_API_KEY}
  YANDEX_GEOCODER_REFERER: ${YANDEX_GEOCODER_REFERER}
  EMAIL_BACKEND: ${EMAIL_BACKEND}
  EMAIL_HOST: ${EMAIL_HOST}
  EMAIL_PORT: ${EMAIL_PORT}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
  USE_S3: ${USE_S3:-False}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_REGION: ${S3_REGION:-ru-1}
  YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
  YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
  GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION}
  YANDEX_VERIFICATION: ${YANDEX_VERIFICATION}
  SITE_DOMAIN: ${SITE_DOMAIN}
  # Производительность Django/Postgres
  CONN_MAX_AGE: ${CONN_MAX_AGE:-60}
  POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-5}
  SESSION_SAVE_EVERY_REQUEST: ${SESSION_SAVE_EVERY_REQUEST:-False}
  # Gunicorn runtime (используются в /entrypoint.sh)
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
  GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
  GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
  GUNICORN_KEEPALIVE: ${GUNICORN_KEEPALIVE:-5}
  # Опционально: первый суперпользователь (создаётся только если суперпользователей ещё нет). Вход в админку — по email.
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tennisfan} -d ${POSTGRES_DB:-tennisfan}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    environment:
      <<: *app-env
    command: ["/entrypoint.sh"]
    expose:
      - "8000"
    volumes:
      - static_data:/app/staticfiles
    labels:
      # Включаем Traefik для этого сервиса
      - "traefik.enable=true"

      # Явно описываем HTTP‑router для боевого сайта
      - "traefik.http.routers.tennisfan.rule=Host(`tennisfan.ru`) || Host(`www.tennisfan.ru`) || Host(`tennistop.ru`) || Host(`www.tennistop.ru`)"
      - "traefik.http.routers.tennisfan.entrypoints=websecure"
      - "traefik.http.routers.tennisfan.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tennisfan.priority=1000"

      # Привязываем router к backend‑service на порту 8000
      - "traefik.http.routers.tennisfan.service=tennisfan"
      - "traefik.http.services.tennisfan.loadbalancer.server.port=8000"

      # Описываем middleware с кастомной страницей техработ
      - "traefik.http.middlewares.maintenance-errors.errors.status=404,500-599"
      - "traefik.http.middlewares.maintenance-errors.errors.service=maintenance@docker"
      - "traefik.http.middlewares.maintenance-errors.errors.query=/"

      # Подключаем middleware к нашему роутеру
      - "traefik.http.routers.tennisfan.middlewares=maintenance-errors"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure

  cron:
    build: .
    entrypoint: ["/cron-entrypoint.sh"]
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:
  static_data:
