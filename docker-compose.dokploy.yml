# Docker Compose для деплоя через Dokploy.
# Содержит PostgreSQL; переменные окружения задаются в Dokploy UI (вкладка Environment).
# В General укажите: Compose file path = docker-compose.dokploy.yml
# (version убран — атрибут устарел в новых Docker Compose)

x-app-env: &app-env
  DEBUG: "False"
  USE_POSTGRES: "True"
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  SECRET_KEY: ${SECRET_KEY}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
  TELEGRAM_SUPPORT_BOT_TOKEN: ${TELEGRAM_SUPPORT_BOT_TOKEN}
  TELEGRAM_USER_BOT_TOKEN: ${TELEGRAM_USER_BOT_TOKEN}
  TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID}
  TELEGRAM_BOT_SITE_BASE_URL: ${TELEGRAM_BOT_SITE_BASE_URL}
  TELEGRAM_PRIVATE_COMMUNITY_CHAT_ID: ${TELEGRAM_PRIVATE_COMMUNITY_CHAT_ID}
  TELEGRAM_PUBLIC_COMMUNITY_URL: ${TELEGRAM_PUBLIC_COMMUNITY_URL:-https://t.me/TennisFanu}
  YANDEX_MAPS_API_KEY: ${YANDEX_MAPS_API_KEY}
  YANDEX_GEOCODER_API_KEY: ${YANDEX_GEOCODER_API_KEY}
  YANDEX_GEOCODER_REFERER: ${YANDEX_GEOCODER_REFERER}
  EMAIL_BACKEND: ${EMAIL_BACKEND}
  EMAIL_HOST: ${EMAIL_HOST}
  EMAIL_PORT: ${EMAIL_PORT}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
  USE_S3: ${USE_S3:-False}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_REGION: ${S3_REGION:-ru-1}
  # Опционально: первый суперпользователь (создаётся только если суперпользователей ещё нет). Вход в админку — по email.
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tennisfan} -d ${POSTGRES_DB:-tennisfan}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    environment:
      <<: *app-env
    command: ["/entrypoint.sh"]
    expose:
      - "8000"
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure

  cron:
    build: .
    entrypoint: ["/cron-entrypoint.sh"]
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:
  static_data:
