version: "3.9"

x-app-env: &app-env
  DEBUG: "False"
  USE_POSTGRES: "True"
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: "5432"
  SECRET_KEY: ${SECRET_KEY}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
  TELEGRAM_SUPPORT_BOT_TOKEN: ${TELEGRAM_SUPPORT_BOT_TOKEN}
  TELEGRAM_USER_BOT_TOKEN: ${TELEGRAM_USER_BOT_TOKEN}
  TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID}
  TELEGRAM_BOT_SITE_BASE_URL: ${TELEGRAM_BOT_SITE_BASE_URL}
  TELEGRAM_PRIVATE_COMMUNITY_CHAT_ID: ${TELEGRAM_PRIVATE_COMMUNITY_CHAT_ID}
  TELEGRAM_PUBLIC_COMMUNITY_URL: ${TELEGRAM_PUBLIC_COMMUNITY_URL:-https://t.me/TennisFanu}
  YANDEX_MAPS_API_KEY: ${YANDEX_MAPS_API_KEY}
  YANDEX_GEOCODER_API_KEY: ${YANDEX_GEOCODER_API_KEY}
  YANDEX_GEOCODER_REFERER: ${YANDEX_GEOCODER_REFERER}
  EMAIL_BACKEND: ${EMAIL_BACKEND}
  EMAIL_HOST: ${EMAIL_HOST}
  EMAIL_PORT: ${EMAIL_PORT}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
  USE_S3: ${USE_S3:-False}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_REGION: ${S3_REGION:-ru-1}

services:
  web:
    build: .
    environment:
      <<: *app-env
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
      GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
      GUNICORN_KEEPALIVE: ${GUNICORN_KEEPALIVE:-5}
    expose:
      - "8000"
    volumes:
      - static_data:/app/staticfiles
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  cron:
    build: .
    entrypoint: ["/cron-entrypoint.sh"]
    environment:
      <<: *app-env
    deploy:
      replicas: 1
      restart_policy:
        condition: any

volumes:
  static_data: