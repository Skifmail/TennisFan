x-app-env: &app-env
  DEBUG: "False"
  USE_POSTGRES: "True"
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: "5432"
  SECRET_KEY: ${SECRET_KEY}
  CHAT_REDIS_URL: ${CHAT_REDIS_URL:-redis://chat_redis:6379/0}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
  TELEGRAM_SUPPORT_BOT_TOKEN: ${TELEGRAM_SUPPORT_BOT_TOKEN}
  TELEGRAM_USER_BOT_TOKEN: ${TELEGRAM_USER_BOT_TOKEN}
  TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID}
  TELEGRAM_BOT_SITE_BASE_URL: ${TELEGRAM_BOT_SITE_BASE_URL}
  TELEGRAM_PRIVATE_COMMUNITY_CHAT_ID: ${TELEGRAM_PRIVATE_COMMUNITY_CHAT_ID}
  TELEGRAM_PUBLIC_COMMUNITY_URL: ${TELEGRAM_PUBLIC_COMMUNITY_URL:-https://t.me/TennisFanu}
  TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-True}
  TELEGRAM_API_PROXY_URL: ${TELEGRAM_API_PROXY_URL:-}
  YANDEX_MAPS_API_KEY: ${YANDEX_MAPS_API_KEY}
  YANDEX_GEOCODER_API_KEY: ${YANDEX_GEOCODER_API_KEY}
  YANDEX_GEOCODER_REFERER: ${YANDEX_GEOCODER_REFERER}
  EMAIL_BACKEND: ${EMAIL_BACKEND}
  EMAIL_HOST: ${EMAIL_HOST}
  EMAIL_PORT: ${EMAIL_PORT}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
  USE_S3: ${USE_S3:-False}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_REGION: ${S3_REGION:-ru-1}

services:
  web:
    build: .
    logging: &app-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "10001:10001"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "8000"]
      interval: 20s
      timeout: 10s
      start_period: 180s
      retries: 3
    environment:
      <<: *app-env
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
      GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
      GUNICORN_KEEPALIVE: ${GUNICORN_KEEPALIVE:-5}
    expose:
      - "8000"
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # Отдельный Redis: кэш сайта не должен вытеснять события WebSocket.
  chat_redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  chat:
    build: .
    logging: *app-logging
    user: "10001:10001"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "8001"]
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 3
    entrypoint: ["daphne", "-b", "0.0.0.0", "-p", "8001", "--proxy-headers", "--ping-interval", "20", "--ping-timeout", "30", "config.asgi:application"]
    environment:
      <<: *app-env
      CONN_MAX_AGE: "0"
      HEALTHCHECK_CHAT_REDIS: "True"
    expose:
      - "8001"
    restart: unless-stopped
    depends_on:
      chat_redis:
        condition: service_healthy
      web:
        condition: service_healthy

  cron:
    build: .
    logging: *app-logging
    restart: unless-stopped
    entrypoint: ["/cron-entrypoint.sh"]
    environment:
      <<: *app-env
    depends_on:
      web:
        condition: service_healthy
    deploy:
      replicas: 1
      restart_policy:
        condition: any
