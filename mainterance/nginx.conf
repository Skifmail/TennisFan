# Страница техработ: код 503 + запрет кэширования.
#
# Раньше ответ отдавался с кодом 200 и Last-Modified, поэтому браузер применял
# эвристический кэш (10% от возраста файла — недели) и показывал «Технические
# работы» ещё долго после восстановления сайта, ни разу не обратившись к серверу.
# 503 + Retry-After честно сообщают клиенту «зайди позже» и не кэшируются.
#
# `=503` обязательно: без него внутренний редирект на страницу сбрасывает код
# ответа на 200, и проблема с кэшем возвращается.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Тело ошибки 503 подменяем страницей техработ, код остаётся 503.
    error_page 503 =503 /index.html;

    location /images/ {
        try_files $uri =404;
        access_log off;
        expires 1h;
    }

    location / {
        return 503;
    }

    # Внутренняя отдача страницы: снаружи /index.html недоступен, иначе страница
    # техработ снова отдавалась бы с кодом 200 и попадала в кэш.
    location = /index.html {
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Retry-After "60" always;
    }
}
