server {
    listen 80;

    # Статические файлы (картинки, svg, css, js) — отдавать как есть
    # Если не найдены — честный 404, без fallback
    location ~* \.(svg|png|jpg|jpeg|gif|ico|webp|css|js|woff2?)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Все остальные пути → страница техработ
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
