# maintenance/docker-compose.yml
services:
  maintenance:
    image: nginx:alpine
    volumes:
      - ./maintenance.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maintenance.rule=Host(`tennisfan.ru`) || Host(`www.tennisfan.ru`)"
      - "traefik.http.routers.maintenance.entrypoints=websecure"
      - "traefik.http.routers.maintenance.tls.certresolver=letsencrypt"
      - "traefik.http.routers.maintenance.priority=1"
      - "traefik.http.routers.maintenance.service=maintenance"
      - "traefik.http.services.maintenance.loadbalancer.server.port=80"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
