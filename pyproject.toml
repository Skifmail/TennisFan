[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
exclude = [".*migrations.*"]

[[tool.mypy.overrides]]
module = ["*.admin"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["apps.subscriptions.models", "apps.core.telegram_support", "apps.core.telegram_notify", "apps.telegram_bot.views", "apps.telegram_bot.services", "apps.content.views", "apps.legal.views", "apps.courts.geocoder", "apps.shop.views"]
disable_error_code = ["import-untyped"]
