[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
fix = true
exclude = ["docs_venv", "venv", ".venv", "__pycache__", "*.pyc", ".git"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
exclude = [".*migrations.*", "docs_venv", "venv", ".venv"]

[[tool.mypy.overrides]]
module = ["*.admin"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["apps.subscriptions.models", "apps.core.telegram_support", "apps.core.telegram_notify", "apps.telegram_bot.views", "apps.telegram_bot.services", "apps.content.views", "apps.legal.views", "apps.courts.geocoder", "apps.shop.views", "apps.clubs.views.legal"]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "apps.payments.yookassa_client",
    "apps.telegram_bot.management.commands.set_telegram_webhooks",
    "apps.clubs.tests",
]
disable_error_code = ["import-untyped"]
