<div class="form-row{% if field.errors %} errors{% endif %}{% if field.field.widget.input_type == 'checkbox' %} checkbox-row{% endif %}">
  {{ field.errors }}
  <div>
    <div class="flex-container">
      {{ field.label_tag }}
      {{ field }}
    </div>
    {% if field.help_text %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}
  </div>
</div>
