<div class="club-player-toolbar-shell">
    <div class="container">
        <nav class="club-player-nav">
            <a href="{% url 'clubs:my_dashboard' %}" class="btn btn-sm {% if current == 'dashboard' %}btn-primary{% else %}btn-ghost{% endif %}">
                Личный кабинет
            </a>
            <a href="{% url 'clubs:my_tournaments' %}" class="btn btn-sm {% if current == 'tournaments' %}btn-primary{% else %}btn-ghost{% endif %}">
                Турниры
            </a>
            <a href="{% url 'clubs:my_plan' %}" class="btn btn-sm {% if current == 'plan' %}btn-primary{% else %}btn-ghost{% endif %}">
                Подписка и лимиты
            </a>
            <a href="{% url 'clubs:club_rating' %}" class="btn btn-sm {% if current == 'rating' %}btn-primary{% else %}btn-ghost{% endif %}">
                Рейтинг
            </a>
            <a href="{% url 'clubs:my_fees' %}" class="btn btn-sm {% if current == 'fees' %}btn-primary{% else %}btn-ghost{% endif %}">
                Взносы
            </a>
            <a href="{% url 'clubs:my_notification_settings' %}" class="btn btn-sm {% if current == 'notifications' %}btn-primary{% else %}btn-ghost{% endif %}">
                Уведомления
            </a>
        </nav>
    </div>
</div>

<nav class="club-bottom-nav" data-club-bottom-nav>
    <a href="{% url 'clubs:my_dashboard' %}"
       class="club-bottom-nav__item {% if current == 'dashboard' %}club-bottom-nav__item--active{% endif %}"
       data-club-tab="dashboard">
        <span class="club-bottom-nav__item-icon">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 11L12 4L20 11V19A1 1 0 0 1 19 20H5A1 1 0 0 1 4 19V11Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M10 20V14H14V20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </span>
        <span class="club-bottom-nav__item-label">Кабинет</span>
    </a>
    <a href="{% url 'clubs:my_tournaments' %}"
       class="club-bottom-nav__item {% if current == 'tournaments' %}club-bottom-nav__item--active{% endif %}"
       data-club-tab="tournaments">
        <span class="club-bottom-nav__item-icon">
            <svg viewBox="0 0 24 24" fill="none">
                <circle cx="8" cy="8" r="3" stroke="currentColor" />
                <circle cx="16" cy="16" r="3" stroke="currentColor" />
                <path d="M10.5 10.5L13.5 13.5" stroke="currentColor" stroke-linecap="round" />
            </svg>
        </span>
        <span class="club-bottom-nav__item-label">Турниры</span>
    </a>
    <a href="{% url 'clubs:club_rating' %}"
       class="club-bottom-nav__item {% if current == 'rating' %}club-bottom-nav__item--active{% endif %}"
       data-club-tab="rating">
        <span class="club-bottom-nav__item-icon">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M5 20V12" stroke="currentColor" stroke-linecap="round" />
                <path d="M10 20V4" stroke="currentColor" stroke-linecap="round" />
                <path d="M15 20V10" stroke="currentColor" stroke-linecap="round" />
                <path d="M20 20V7" stroke="currentColor" stroke-linecap="round" />
            </svg>
        </span>
        <span class="club-bottom-nav__item-label">Рейтинг</span>
    </a>
    <button type="button" class="club-bottom-nav__item club-bottom-nav__item--more {% if current == 'plan' or current == 'fees' or current == 'notifications' %}club-bottom-nav__item--active{% endif %}" data-club-bottom-more>
        <span class="club-bottom-nav__item-icon">
            <svg viewBox="0 0 24 24" fill="none">
                <circle cx="5" cy="12" r="1.5" fill="currentColor" />
                <circle cx="12" cy="12" r="1.5" fill="currentColor" />
                <circle cx="19" cy="12" r="1.5" fill="currentColor" />
            </svg>
        </span>
        <span class="club-bottom-nav__item-label">Ещё</span>
    </button>
</nav>

<div class="club-bottom-sheet" id="club-bottom-sheet" aria-hidden="true">
    <div class="club-bottom-sheet__backdrop" data-club-bottom-close></div>
    <div class="club-bottom-sheet__panel">
        <div class="club-bottom-sheet__handle"></div>
        <nav class="club-bottom-sheet__list">
            <a href="{% url 'clubs:my_plan' %}" class="club-bottom-sheet__link">
                <span class="club-bottom-sheet__link-icon">★</span>
                <span>Подписка и лимиты</span>
            </a>
            <a href="{% url 'clubs:my_fees' %}" class="club-bottom-sheet__link">
                <span class="club-bottom-sheet__link-icon">₽</span>
                <span>Взносы</span>
            </a>
            <a href="{% url 'clubs:my_notification_settings' %}" class="club-bottom-sheet__link">
                <span class="club-bottom-sheet__link-icon">🔔</span>
                <span>Уведомления</span>
            </a>
        </nav>
    </div>
</div>
