{% extends "base.html" %}
{% block title %}Уведомления клуба — {{ club.name }}{% endblock %}
{% block content %}
{% include "clubs/_club_dashboard_nav.html" with current="notifications" %}
<div class="page-header">
    <h1 class="page-title">{{ club.name }}</h1>
    <p class="page-subtitle">Настройки уведомлений клуба</p>
</div>
<div class="container" style="max-width: 720px;">
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <h3 style="font-size: 1rem; margin-bottom: var(--spacing-md);">Каналы доставки</h3>
                <div style="margin-bottom: var(--spacing-md);">
                    <label style="display: flex; align-items: center; gap: var(--spacing-sm); cursor: pointer;">
                        <input type="checkbox" name="notify_by_email" {% if form.instance.notify_by_email %}checked{% endif %}>
                        <span><b>Email-уведомления</b></span>
                    </label>
                </div>
                <div style="margin-bottom: var(--spacing-lg);">
                    <label style="display: flex; align-items: center; gap: var(--spacing-sm); cursor: pointer;">
                        <input type="checkbox" name="notify_by_telegram" {% if form.instance.notify_by_telegram %}checked{% endif %}>
                        <span><b>Telegram-уведомления</b></span>
                    </label>
                </div>
                <h3 style="font-size: 1rem; margin-bottom: var(--spacing-md);">Типы событий</h3>
                <div style="display: grid; gap: var(--spacing-md); margin-bottom: var(--spacing-lg);">
                    <label style="display: flex; align-items: center; gap: var(--spacing-sm); cursor: pointer;">
                        <input type="checkbox" name="fee_reminders_enabled" {% if form.instance.fee_reminders_enabled %}checked{% endif %}>
                        <span>Напоминания о взносах</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: var(--spacing-sm); cursor: pointer;">
                        <input type="checkbox" name="fee_overdue_enabled" {% if form.instance.fee_overdue_enabled %}checked{% endif %}>
                        <span>Уведомления о просрочке взноса</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: var(--spacing-sm); cursor: pointer;">
                        <input type="checkbox" name="fee_paid_enabled" {% if form.instance.fee_paid_enabled %}checked{% endif %}>
                        <span>Подтверждение оплаты взноса</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: var(--spacing-sm); cursor: pointer;">
                        <input type="checkbox" name="subscription_expiring_enabled" {% if form.instance.subscription_expiring_enabled %}checked{% endif %}>
                        <span>Истечение подписки клуба</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: var(--spacing-sm); cursor: pointer;">
                        <input type="checkbox" name="tournament_reminders_enabled" {% if form.instance.tournament_reminders_enabled %}checked{% endif %}>
                        <span>Напоминания о турнирах</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: var(--spacing-sm); cursor: pointer;">
                        <input type="checkbox" name="new_member_enabled" {% if form.instance.new_member_enabled %}checked{% endif %}>
                        <span>Новый участник клуба</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: var(--spacing-sm); cursor: pointer;">
                        <input type="checkbox" name="debtors_summary_enabled" {% if form.instance.debtors_summary_enabled %}checked{% endif %}>
                        <span>Сводка должников</span>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
