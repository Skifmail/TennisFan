{% extends "base.html" %}
{% block title %}Пригласить по email — {{ club.name }}{% endblock %}
{% block content %}
<div class="page-header">
    <h1 class="page-title">Пригласить игрока по email</h1>
    <p class="page-subtitle">Клуб {{ club.name }}</p>
</div>
<div class="container" style="max-width: 480px;">
    <div class="card">
        <div class="card-body" style="padding: var(--spacing-2xl);">
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label" for="id_email">{{ form.email.label }}</label>
                    {{ form.email }}
                    {% for err in form.email.errors %}<p class="text-error">{{ err }}</p>{% endfor %}
                </div>
                <button type="submit" class="btn btn-primary">Отправить приглашение</button>
                <a href="{% url 'clubs:dashboard' slug=club.slug %}" class="btn btn-ghost">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
