{% extends 'base.html' %}

{% block title %}О нас{% endblock %}

{% block content %}
<div class="container" style="padding-top: var(--spacing-2xl); max-width: 800px;">
    <h1 class="page-title" style="text-align: center; text-transform: uppercase; letter-spacing: 0.05em;">О НАС</h1>

    {% if about.subtitle %}
    <p class="text-muted text-center mb-4" style="font-size: var(--font-size-lg);">{{ about.subtitle }}</p>
    {% endif %}

    {% if about.image %}
    <div class="mb-4" style="text-align: center;">
        <img src="{{ about.image.url }}" alt="О нас" class="about-image"
            style="max-width: 100%; border-radius: var(--radius-lg); box-shadow: var(--shadow-md);">
    </div>
    {% endif %}

    {% if about.body %}
    <div class="card mb-4">
        <div class="card-body legal-doc__body">
            {{ body_html|safe }}
        </div>
    </div>
    {% endif %}

    <div class="text-center mb-5">
        <a href="{% url 'donate' %}" class="btn btn-donate">Поддержать проект</a>
    </div>
</div>
{% endblock %}
