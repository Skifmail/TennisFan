<form
    method="post"
    action="{% url 'platform_activity_announce' %}"
    class="club-dashboard-announce{% if extra_class %} {{ extra_class }}{% endif %}"
>
    {% csrf_token %}
    {% if next_page %}
    <input type="hidden" name="next" value="{{ next_page }}">
    {% endif %}
    <label class="club-dashboard-announce__label" for="activity-announce-{{ next_page|default:'dashboard' }}">Сообщение в ленту событий</label>
    <div class="club-dashboard-announce__controls">
        <textarea
            id="activity-announce-{{ next_page|default:'dashboard' }}"
            name="message"
            class="form-control"
            rows="3"
            maxlength="500"
            required
            placeholder="Текст, который увидят все посетители главной"
        ></textarea>
        <button type="submit" class="btn btn-primary club-dashboard-announce__submit">Отправить в ленту</button>
    </div>
</form>
