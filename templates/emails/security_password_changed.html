<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пароль изменён</title>
</head>
<body>
    <p>Здравствуйте, {{ user.get_full_name|default:user.email }}!</p>
    <p>Пароль вашего аккаунта был изменён.</p>
    <p>Время: {{ event_at|date:"d.m.Y H:i" }}</p>
    {% if ip_address %}
    <p>IP-адрес: {{ ip_address }}</p>
    {% endif %}
    <p>Если это были не вы, срочно восстановите доступ через форму сброса пароля.</p>
</body>
</html>
