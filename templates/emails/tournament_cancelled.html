<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Турнир отменён</title>
</head>
<body>
    <p>Здравствуйте, {{ user.get_full_name|default:user.email }}!</p>
    <p>Турнир «{{ tournament.name }}» отменён.</p>
    <p>Причина: {{ reason }}</p>
    <p>На ваш баланс возвращено <b>{{ refunded_ft }} FT</b>.</p>
    <p><a href="{{ tournament_url }}">Открыть страницу турнира</a></p>
    <p>С уважением,<br>Команда TennisFan</p>
</body>
</html>
