{% load static %}
{% if avatar %}
<img src="{{ avatar.url }}" alt="" class="{{ class|default:'player-avatar' }}{% if size %} avatar--{{ size }}{% endif %}">
{% elif url %}
<img src="{{ url }}" alt="" class="{{ class|default:'player-avatar' }}{% if size %} avatar--{{ size }}{% endif %}">
{% else %}
<img src="{% static 'images/avatar_placeholder.png' %}" alt="" class="{{ class|default:'player-avatar' }}{% if size %} avatar--{{ size }}{% endif %}">
{% endif %}
