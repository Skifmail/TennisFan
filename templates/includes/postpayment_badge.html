{% if tournament.allow_postpayment %}
<span
    class="{% if class_name %}{{ class_name }}{% else %}badge badge-soft{% endif %}"
    title="Постоплата: можно зарегистрироваться без немедленной оплаты. После открытия окна срок — до {{ tournament.get_postpayment_deadline_hours }} ч.{% if tournament.is_one_day %}, но не позже объявленного времени начала игры{% endif %}."
>
    ПОСТОПЛАТА
</span>
{% endif %}
