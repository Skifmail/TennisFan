{# current_sport: tennis|padel. Опционально aria_label. #}
<nav class="profile-sport-switch" aria-label="{{ aria_label|default:'Вид спорта' }}">
    <a
        href="?sport=tennis"
        class="profile-sport-switch__choice{% if current_sport != 'padel' %} is-active{% endif %}"
        {% if current_sport != 'padel' %}aria-current="page"{% endif %}
    >
        <svg class="profile-sport-switch__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="9" fill="#d4e157"></circle>
            <path d="M4.8 8.2c3.8 2.1 3.8 5.5 0 7.6M19.2 8.2c-3.8 2.1-3.8 5.5 0 7.6" fill="none" stroke="#163226" stroke-width="1.7" stroke-linecap="round"></path>
        </svg>
        <span>Теннис</span>
    </a>
    <a
        href="?sport={% if current_sport == 'padel' %}tennis{% else %}padel{% endif %}"
        class="profile-sport-switch__track{% if current_sport == 'padel' %} is-padel{% endif %}"
        role="switch"
        aria-checked="{% if current_sport == 'padel' %}true{% else %}false{% endif %}"
        aria-label="{% if current_sport == 'padel' %}Сейчас падел, переключить на теннис{% else %}Сейчас теннис, переключить на падел{% endif %}"
    >
        <span class="profile-sport-switch__knob"></span>
    </a>
    <a
        href="?sport=padel"
        class="profile-sport-switch__choice{% if current_sport == 'padel' %} is-active{% endif %}"
        {% if current_sport == 'padel' %}aria-current="page"{% endif %}
    >
        <svg class="profile-sport-switch__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="7" y="2.5" width="10" height="13.5" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"></rect>
            <circle cx="10.2" cy="7" r="1" fill="currentColor"></circle>
            <circle cx="13.8" cy="7" r="1" fill="currentColor"></circle>
            <circle cx="12" cy="10.2" r="1" fill="currentColor"></circle>
            <path d="M12 16.2v4.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            <path d="M10.2 21.2h3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
        <span>Падел</span>
    </a>
</nav>
