{% load static %}
<link rel="manifest" href="{% url 'web_app_manifest' %}">
{{ web_push_config|json_script:"web-push-config" }}
<script defer src="{% static 'js/push_confirmation_handoff.js' %}"></script>
<script defer src="{% static 'js/push_navigation.js' %}"></script>
{% if web_push_needed %}
<script defer src="{% static 'js/web_push.js' %}"></script>
{% if web_push_sdk_url %}
<script id="onesignal-sdk" defer src="{{ web_push_sdk_url }}"></script>
{% else %}
<script id="onesignal-sdk" defer src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"></script>
{% endif %}
{% endif %}
