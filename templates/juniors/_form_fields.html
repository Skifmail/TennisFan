{% for field in form %}
{% if field.is_hidden %}{{ field }}{% else %}
<div class="jl-field{% if field.field.widget.input_type == 'checkbox' %} jl-field-wide{% endif %}">
    {% if field.field.widget.input_type == 'checkbox' %}
    <label class="jl-check" for="{{ field.id_for_label }}">{{ field }}<span>{{ field.label }}</span></label>
    {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
    {% endif %}
    {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}
</div>
{% endif %}
{% endfor %}
