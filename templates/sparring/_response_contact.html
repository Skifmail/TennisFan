{% load static %}
{# Название мессенджера без ника; номер виден только у кнопки звонка. #}
{% if link.url %}
<a class="sparring-contact sparring-contact--{{ link.key }}" href="{{ link.url }}"{% if link.key == 'phone' %} data-confirm-call{% endif %}{% if link.external %} target="_blank" rel="noopener"{% endif %}>
{% else %}
<button type="button" class="sparring-contact sparring-contact--{{ link.key }} sparring-contact--text" disabled title="Игрок не указал ссылку для перехода в {{ link.label }}">
{% endif %}
    <span class="sparring-contact__heading">
    {% if link.key == 'telegram' %}
    <img src="{% static 'images/Telegram_logo.svg' %}" alt="" class="sparring-contact__icon" width="18" height="18" loading="lazy">
    {% elif link.key == 'whatsapp' %}
    <img src="{% static 'images/WhatsApp.svg' %}" alt="" class="sparring-contact__icon" width="18" height="18" loading="lazy">
    {% elif link.key == 'max' %}
    <img src="{% static 'images/Max_logo_2025.png' %}" alt="" class="sparring-contact__icon" width="18" height="18" loading="lazy">
    {% else %}
    <svg class="sparring-contact__icon sparring-contact__icon--phone" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7 12.8 12.8 0 0 0 .7 2.8 2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5 12.8 12.8 0 0 0 2.8.7 2 2 0 0 1 1.8 2.1z"/></svg>
    {% endif %}
        <span class="sparring-contact__label">{% if link.key == 'phone' %}Позвонить{% else %}{{ link.label }}{% endif %}</span>
    </span>
    {% if link.key == 'phone' %}
    <span class="sparring-contact__value">{{ link.value }}</span>
    {% elif not link.url %}
    <span class="sparring-contact__hint">Нет ссылки</span>
    {% endif %}
{% if link.url %}</a>{% else %}</button>{% endif %}
