<div class="profile-editor__field{% if field.errors %} profile-editor__field--error{% endif %}">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="profile-editor__required" aria-hidden="true"> *</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<p id="{{ field.auto_id }}_helptext" class="profile-editor__hint">{{ field.help_text }}</p>{% endif %}
    {% if hint %}<p class="profile-editor__hint">{{ hint }}</p>{% endif %}
    {% if field.errors %}<ul id="{{ field.auto_id }}_error" class="profile-editor__errors" role="alert">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
</div>
