{% extends 'base.html' %}
{% load static %}

{% block title %}Пароль изменён{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Пароль успешно изменён</h1>
</div>

<div class="container" style="max-width: 500px;">
    <div class="card">
        <div class="card-body" style="padding: var(--spacing-2xl); text-align: center;">
            <p class="text-secondary" style="margin-bottom: var(--spacing-xl);">
                Ваш пароль был успешно изменён. Теперь используйте новый пароль для входа в систему.
            </p>

            <div class="d-flex gap-2" style="justify-content: center;">
                <a href="{% url 'profile_edit' %}" class="btn btn-primary">Вернуться к редактированию профиля</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
