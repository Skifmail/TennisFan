{% extends 'base.html' %}
{% load static %}

{% block title %}Пароль изменён{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; margin: var(--spacing-3xl) auto;">
    <div class="card">
        <div class="card-body" style="padding: var(--spacing-2xl); text-align: center;">
            <h1 class="page-title" style="margin-bottom: var(--spacing-lg);">Пароль успешно изменён</h1>
            
            <p class="text-secondary" style="margin-bottom: var(--spacing-xl);">
                Ваш пароль был успешно изменён. Теперь вы можете войти в систему, используя новый пароль.
            </p>

            <div class="d-flex gap-2" style="justify-content: center;">
                <a href="{% url 'auth' %}?mode=login" class="btn btn-primary btn-lg">Войти</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
