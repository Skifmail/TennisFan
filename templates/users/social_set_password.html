{% extends 'base.html' %}
{% block title %}Задать пароль{% endblock %}
{% block content %}
<div class="container" style="max-width:600px; padding:2rem 1rem;">
    <h1>Задать пароль</h1>
    <p>После этого вы сможете входить по email и паролю, а также через подключённые соцсети.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить пароль</button>
        <a href="{% url 'social_connections' %}" class="btn btn-ghost">Отмена</a>
    </form>
</div>
{% endblock %}
