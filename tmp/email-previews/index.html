<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Превью писем: турнир завершён</title>
    <style>
        :root { color-scheme: dark; }
        body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#121212; color:#e8e4dc; }
        header { padding:28px 24px 12px; max-width:1280px; margin:0 auto; }
        h1 { margin:0 0 8px; font-size:22px; font-weight:650; }
        .lead { margin:0; color:#9a958c; font-size:14px; line-height:1.5; }
        nav { display:flex; gap:8px; flex-wrap:wrap; padding:16px 24px 8px; max-width:1280px; margin:0 auto; }
        nav a { color:#e8e4dc; text-decoration:none; border:1px solid #3a3a3a; border-radius:999px; padding:8px 14px; font-size:13px; }
        nav a:hover, nav a.is-active { background:#a6824a; border-color:#a6824a; color:#111; }
        .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:20px; padding:16px 24px 48px; max-width:1280px; margin:0 auto; }
        figure { margin:0; }
        figcaption { font-size:13px; color:#9a958c; margin:0 0 10px; }
        iframe { width:100%; height:1180px; border:0; border-radius:12px; background:#f4f4f4; box-shadow:0 12px 40px rgba(0,0,0,.35); }
    </style>
</head>
<body>
    <header>
        <h1>Превью писем после завершения турнира</h1>
        <p class="lead">Три варианта одного шаблона. Данные — «Многодневный турнир Воскресенск». Это макет, рассылка ещё не подключена.</p>
    </header>
    <nav>
        <a href="place-1.html">1 место</a>
        <a href="place-3.html">3 место</a>
        <a href="place-5.html">5 место</a>
    </nav>
    <div class="grid">
        <figure>
            <figcaption>1 место — кубок, поздравление, получатель подсвечен на подиуме</figcaption>
            <iframe src="place-1.html" title="Письмо за 1 место"></iframe>
        </figure>
        <figure>
            <figcaption>3 место — бронзовый кубок, тот же каркас</figcaption>
            <iframe src="place-3.html" title="Письмо за 3 место"></iframe>
        </figure>
        <figure>
            <figcaption>5 место — без кубка, место и очки, подиум справочно</figcaption>
            <iframe src="place-5.html" title="Письмо за 5 место"></iframe>
        </figure>
    </div>
</body>
</html>
